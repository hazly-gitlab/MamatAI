version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: jarvis_postgres
    restart: always
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: jarvis_password
      POSTGRES_DB: jarvis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_user -d jarvis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: jarvis_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://jarvis_user:jarvis_password@postgres:5432/jarvis_db
      - REDIS_URL=redis://redis:6379/0
      - APP_NAME=JARVIS
      - SECRET_KEY=super_secret_jarvis_key_change_me_in_production
      - LLM_PROVIDER=mock
      - STT_PROVIDER=mock
      - TTS_PROVIDER=mock
      - VISION_PROVIDER=mock
      - ALLOWED_HTTP_DOMAINS=api.weatherapi.com,wttr.in,api.github.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Auto run db tables creation on boot prior to server launch
    command: >
      sh -c "python3 app/core/init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: jarvis_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
