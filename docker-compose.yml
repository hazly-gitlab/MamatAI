services:
  db:
    image: postgres:15-alpine
    container_name: jarvis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-MAMAT AI}
      - APP_URL=${APP_URL:-http://localhost}
      - API_URL=${API_URL:-http://localhost/api/v1}
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_me_in_production_32_chars_at_least}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///jarvis.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-local_first}
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - STT_PROVIDER=${STT_PROVIDER:-browser}
      - TTS_PROVIDER=${TTS_PROVIDER:-browser}
      - VISION_PROVIDER=${VISION_PROVIDER:-openai}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      - db
      - redis
      - ollama
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: jarvis-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  uploads_data:
